name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      # Installs the toolchain pinned in rust-toolchain.toml.
      - run: rustup toolchain install
      - run: cargo fmt --all --check

  check:
    name: Lint and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Running time only; time spent waiting for a runner does not count.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      # Tests compare runs within one process. This compares two processes,
      # which also catches anything that varies per process.
      - name: Headless runs are reproducible
        shell: bash
        run: |
          cargo build --release --locked -p expanse-headless
          first=$(cargo run --release --locked -q -p expanse-headless -- --seed 1 --ticks 100000)
          second=$(cargo run --release --locked -q -p expanse-headless -- --seed 1 --ticks 100000)
          echo "first:  $first"
          echo "second: $second"
          [ "$first" = "$second" ]

  # Warnings about documents that deserve a review. Deliberately not listed
  # under `needs` below: it never blocks a merge, and fails only if the tool
  # cannot read the documents.
  docs:
    name: Documents to review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Report documents over their size signal
        shell: bash
        run: |
          out=$(cargo run -q --locked -p expanse-docs-check)
          echo "$out"
          if [ -n "$out" ]; then
            { echo "### Documents to review"; echo; echo "$out"; } >> "$GITHUB_STEP_SUMMARY"
          fi

  # The only check required by branch protection. Jobs above can be renamed or
  # added without touching the repository settings: list them under `needs`.
  ci-passed:
    name: CI passed
    needs: [format, check]
    # Run even when a needed job fails or is skipped: a skipped required check
    # would otherwise count as passing.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every needed job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              exit 1
            fi
          done
